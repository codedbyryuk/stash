[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stash"
version = "0.1.0"
description = "A CLI tool for eliminating repetitive computer tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.27.0",
    "rich>=15.0.0"
]

[project.scripts]
stash = "stash.cli:app"

[tool.setuptools.packages.find]
include = ["stash*"]

[tool.setuptools.package-data]
stash = ["automations/*.json"]
